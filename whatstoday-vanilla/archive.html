<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>What'sToday · Archive</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div id="navContainer"></div>

<main class="site">
  <section class="pageHero" style="padding:80px 40px 40px">
    <h1><span class="hash">#</span>Archive</h1>
    <p class="subhead">Every past issue, every conversation. Search by date, category, or keyword.</p>
  </section>

  <div class="container" style="padding-bottom:80px">
    <!-- Filter bar -->
    <div style="display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--border-light);margin-bottom:20px;flex-wrap:wrap">
      <div style="display:flex;gap:6px" id="catFilters">
        <button class="primaryBtn" style="padding:7px 14px;font-size:13px;border-radius:999px" data-cat="all"           onclick="filterCat('all',this)">All</button>
        <button class="outlineBtn" style="padding:7px 14px;font-size:13px;border-radius:999px" data-cat="economy"       onclick="filterCat('economy',this)">Economy</button>
        <button class="outlineBtn" style="padding:7px 14px;font-size:13px;border-radius:999px" data-cat="politics"      onclick="filterCat('politics',this)">Politics</button>
        <button class="outlineBtn" style="padding:7px 14px;font-size:13px;border-radius:999px" data-cat="entertainment" onclick="filterCat('entertainment',this)">Entertainment</button>
      </div>
      <span style="flex:1"></span>
      <button class="outlineBtn" style="font-size:14px">📅 May 2026 ▾</button>
      <div class="sortToggle">
        <button class="active" onclick="setView('list',this)">≡ List</button>
        <button onclick="setView('calendar',this)">📅 Calendar</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--surface-2);border-radius:999px;font-size:13px;color:var(--text-light);width:200px">
        <span>🔍</span>
        <input id="searchInput" type="text" placeholder="Search archive"
          style="border:none;background:transparent;font-size:13px;color:var(--text);outline:none;width:100%;font-family:inherit"
          oninput="searchArchive(this.value)"/>
      </div>
    </div>

    <!-- List view -->
    <div id="listView">
      <div id="archiveList"></div>
      <div class="pagination" id="pagination"></div>
    </div>

    <!-- Calendar view (hidden by default) -->
    <div id="calendarView" style="display:none">
      <div class="card" style="padding:24px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
          <button class="ghostBtn">‹</button>
          <span style="font-size:20px;font-weight:700;letter-spacing:-0.3px">May 2026</span>
          <button class="ghostBtn">›</button>
        </div>
        <div id="calendarGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:13px;text-align:center"></div>
        <div style="display:flex;gap:14px;margin-top:14px;font-size:12px;color:var(--text-light)">
          <span><span style="width:8px;height:8px;border-radius:4px;background:#845EF7;display:inline-block;margin-right:4px"></span>Economy</span>
          <span><span style="width:8px;height:8px;border-radius:4px;background:#FF8C42;display:inline-block;margin-right:4px"></span>Politics</span>
          <span><span style="width:8px;height:8px;border-radius:4px;background:#20C997;display:inline-block;margin-right:4px"></span>Entertainment</span>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="footerContainer"></div>

<script src="js/shared.js"></script>
<script>
  renderNav({ activePage: 'archive', container: document.getElementById('navContainer') });
  renderFooter(document.getElementById('footerContainer'));

  const ALL_ISSUES = [
    { d:'May 16, 2026', cat:'Economy',       t:'Korean won hits 6-month low', p:247, c:1832, v:'9.8k', tone:'violet', href:'board.html' },
    { d:'May 16, 2026', cat:'Politics',      t:'National Assembly debates 4-day work week', p:412, c:3104, v:'15.2k', tone:'peach', href:'board-politics.html' },
    { d:'May 16, 2026', cat:'Entertainment', t:'K-pop agency announces fully AI-generated group', p:583, c:4221, v:'21k', tone:'mint', href:'board-entertainment.html' },
    { d:'May 15, 2026', cat:'Economy',       t:'AI hiring tools: fair or not?', p:340, c:2108, v:'12.4k', tone:'violet', href:'board.html' },
    { d:'May 15, 2026', cat:'Politics',      t:'Climate disclosure law amendments', p:189, c:1322, v:'8.1k', tone:'peach', href:'board-politics.html' },
    { d:'May 15, 2026', cat:'Entertainment', t:'Streaming platform consolidation', p:521, c:3812, v:'21k', tone:'mint', href:'board-entertainment.html' },
    { d:'May 14, 2026', cat:'Economy',       t:'Bank of Korea holds rates steady', p:248, c:1654, v:'9.8k', tone:'peach', href:'board.html' },
    { d:'May 14, 2026', cat:'Politics',      t:'4-day work week pilot debated', p:412, c:3104, v:'15.2k', tone:'violet', href:'board-politics.html' },
    { d:'May 14, 2026', cat:'Entertainment', t:'BTS solo album release controversy', p:892, c:6321, v:'34k', tone:'mint', href:'board-entertainment.html' },
    { d:'May 13, 2026', cat:'Economy',       t:'Export growth slows in April', p:203, c:987, v:'6.2k', tone:'violet', href:'board.html' },
    { d:'May 13, 2026', cat:'Politics',      t:'New housing relief bill', p:167, c:821, v:'5.4k', tone:'peach', href:'board-politics.html' },
    { d:'May 13, 2026', cat:'Entertainment', t:'Streaming wars: who wins Korea?', p:431, c:2890, v:'13.7k', tone:'mint', href:'board-entertainment.html' },
  ];

  let activeCat = 'all';
  let currentPage = 1;
  const PER_PAGE = 6;

  function filterCat(cat, btn) {
    activeCat = cat;
    document.querySelectorAll('#catFilters button').forEach(b => {
      b.className = b === btn ? 'primaryBtn' : 'outlineBtn';
      b.style.cssText = 'padding:7px 14px;font-size:13px;border-radius:999px';
    });
    currentPage = 1;
    renderList();
  }

  function searchArchive(q) {
    const lower = q.toLowerCase();
    const filtered = ALL_ISSUES.filter(i =>
      (activeCat === 'all' || i.cat.toLowerCase() === activeCat) &&
      (i.t.toLowerCase().includes(lower) || i.cat.toLowerCase().includes(lower))
    );
    renderListItems(filtered);
  }

  function filtered() {
    return ALL_ISSUES.filter(i => activeCat === 'all' || i.cat.toLowerCase() === activeCat);
  }

  function renderList() {
    const items = filtered();
    const start = (currentPage - 1) * PER_PAGE;
    const page  = items.slice(start, start + PER_PAGE);
    renderListItems(page);
    renderPagination(items.length);
  }

  function renderListItems(items) {
    document.getElementById('archiveList').innerHTML = items.map(r => `
      <div class="archiveRow" onclick="window.location='${r.href}'">
        <div style="font-size:13px;color:var(--text-light);line-height:1.4">
          <div style="font-weight:600;color:var(--text-mid)">${r.d.split(',')[0]}</div>
          <div>${r.d.split(',')[1]}</div>
        </div>
        <div>
          <div style="font-size:13px;color:var(--text-mid);font-weight:600;margin-bottom:6px">${r.cat}</div>
          <div style="font-size:20px;font-weight:700;letter-spacing:-0.4px;line-height:1.3;margin-bottom:8px">${r.t}</div>
          <div style="display:flex;gap:14px;font-size:13px;color:var(--text-light)">
            <span>💬 ${r.p} posts</span><span>· ${r.c} comments</span><span>· 👁 ${r.v}</span>
          </div>
        </div>
        <div class="imgCard ${r.tone} archiveImg" style="font-size:0;min-height:80px;aspect-ratio:16/9"></div>
      </div>
    `).join('');
  }

  function renderPagination(total) {
    const pages = Math.ceil(total / PER_PAGE);
    if (pages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
    let html = `<button class="outlineBtn" style="padding:8px 14px;font-size:14px" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>← Prev</button>`;
    for (let i = 1; i <= pages; i++) {
      html += `<button class="pageBtn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    }
    html += `<button class="outlineBtn" style="padding:8px 14px;font-size:14px" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>Next →</button>`;
    document.getElementById('pagination').innerHTML = html;
  }

  function goPage(p) {
    const pages = Math.ceil(filtered().length / PER_PAGE);
    if (p < 1 || p > pages) return;
    currentPage = p;
    renderList();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Calendar view
  function renderCalendar() {
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    let html = days.map(d => `<div style="color:var(--text-light);padding:8px 0;font-weight:600;font-size:12px">${d}</div>`).join('');
    for (let i = 0; i < 35; i++) {
      const d = i - 3; // May 2026 starts on Friday (offset 5, adjust for 0-indexed)
      if (d < 1 || d > 31) { html += `<div></div>`; continue; }
      const today = d === 16;
      const has = d <= 16;
      html += `
        <div style="min-height:64px;padding:8px;border:1px solid var(--border-light);border-radius:8px;
                    background:${today?'var(--accent-soft)':'var(--bg)'};
                    border-color:${today?'var(--accent)':'var(--border-light)'};
                    font-size:12px;font-weight:600;color:${today?'var(--accent)':'var(--text-mid)'};text-align:left">
          ${d}
          ${has ? `<div style="display:flex;gap:2px;margin-top:6px">
            <span style="width:6px;height:6px;border-radius:3px;background:#845EF7"></span>
            <span style="width:6px;height:6px;border-radius:3px;background:#FF8C42"></span>
            <span style="width:6px;height:6px;border-radius:3px;background:#20C997"></span>
          </div>` : ''}
        </div>
      `;
    }
    document.getElementById('calendarGrid').innerHTML = html;
  }

  let currentView = 'list';
  function setView(view, btn) {
    currentView = view;
    document.querySelectorAll('.sortToggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('listView').style.display     = view === 'list'     ? 'block' : 'none';
    document.getElementById('calendarView').style.display = view === 'calendar' ? 'block' : 'none';
    if (view === 'calendar') renderCalendar();
  }

  // Init
  const params = new URLSearchParams(window.location.search);
  const catParam = params.get('cat');
  if (catParam) {
    const btn = document.querySelector(`[data-cat="${catParam}"]`);
    if (btn) filterCat(catParam, btn);
  }

  renderList();
</script>
</body>
</html>
